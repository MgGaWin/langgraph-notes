name: 🐛 Bug 报告
description: "发现 Bug？请填写此模板帮助我们快速定位问题"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提交 Bug 报告！请尽量填写完整信息，帮助我们快速复现和修复 🙏
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰描述你遇到的问题
      placeholder: "例如：运行某个示例代码时报错..."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何触发这个问题？
      placeholder: |
        1. 克隆仓库
        2. 进入目录
        3. 运行代码
        4. 看到错误
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 你期望发生什么？
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么？（错误截图或日志）
    validations:
      required: false
  - type: dropdown
    id: environment
    attributes:
      label: 运行环境
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python 版本
      placeholder: "例如：3.11.5"
    validations:
      required: true
